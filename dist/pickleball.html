// ============================================================
// MATH & GEOMETRY UTILITIES
// ============================================================

function clamp(val, min, max) {
  return Math.max(min, Math.min(max, val));
}

function lerp(a, b, t) {
  return a + (b - a) * t;
}

function distance(x1, y1, x2, y2) {
  const dx = x2 - x1;
  const dy = y2 - y1;
  return Math.sqrt(dx * dx + dy * dy);
}

function angle(x1, y1, x2, y2) {
  return Math.atan2(y2 - y1, x2 - x1);
}

function randRange(min, max) {
  return min + Math.random() * (max - min);
}

function randInt(min, max) {
  return Math.floor(randRange(min, max + 1));
}

function easeInOut(t) {
  return t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
}

// === src/input.js ===
// ============================================================
// KEYBOARD INPUT MANAGER — Simple and reliable
// ============================================================

const keysDown = {};
let pressedThisFrame = {};
let releasedThisFrame = {};

function onKeyDown(e) {
  if (!keysDown[e.key]) {
    keysDown[e.key] = true;
    pressedThisFrame[e.key] = true;
  }
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) {
    e.preventDefault();
  }
}

function onKeyUp(e) {
  keysDown[e.key] = false;
  releasedThisFrame[e.key] = true;
}

function initInput() {
  window.addEventListener('keydown', onKeyDown);
  window.addEventListener('keyup', onKeyUp);
}

// Call ONCE per frame, AFTER update has consumed the events
function inputTick() {
  pressedThisFrame = {};
  releasedThisFrame = {};
}

function isDown(key) {
  return !!keysDown[key];
}

function isPressed(key) {
  return !!pressedThisFrame[key];
}

function isReleased(key) {
  return !!releasedThisFrame[key];
}

const CHAR_WIDTH = 5;
const CHAR_HEIGHT = 7;

function drawText(ctx, text, x, y, color = '#ffffff', scale = 1) {
  ctx.fillStyle = color;
  const str = text.toUpperCase();
  for (let i = 0; i < str.length; i++) {
    const charData = FONT_DATA[str[i]];
    if (!charData) continue;
    const cx = x + i * (CHAR_WIDTH + 1) * scale;
    for (let row = 0; row < CHAR_HEIGHT; row++) {
      for (let col = 0; col < CHAR_WIDTH; col++) {
        if (charData[row] & (1 << (CHAR_WIDTH - 1 - col))) {
          ctx.fillRect(
            cx + col * scale,
            y + row * scale,
            scale,
            scale
          );
        }
      }
    }
  }
}

function measureText(text, scale = 1) {
  return {
    width: text.length * (CHAR_WIDTH + 1) * scale - scale,
    height: CHAR_HEIGHT * scale,
  };
}

function drawTextCentered(ctx, text, cx, y, color = '#ffffff', scale = 1) {
  const { width } = measureText(text, scale);
  drawText(ctx, text, Math.floor(cx - width / 2), y, color, scale);
}

// === src/sprites.js ===

function drawPlayerSprite(ctx, x, y, avatarIndex, facing, animState, animFrame, gender = 'male') {
  const avatar = AVATARS[avatarIndex] || AVATARS[0];
  const color = avatar.color;
  const px = Math.floor(x);
  const py = Math.floor(y);

  const state = animState || 'idle';
  const frame = animFrame || 0;

  // --- Shadow ---
  ctx.fillStyle = PALETTE.SHADOW;
  ctx.fillRect(px + 4, py + 33, 16, 3);
  ctx.fillRect(px + 6, py + 35, 12, 1);

  // --- Legs (skin) — walk cycle for 'walk', static for everything else ---
  ctx.fillStyle = PALETTE.SKIN_LIGHT;
  if (state === 'walk') {
    const walk = Math.floor(frame) % 4;
    if (walk === 0 || walk === 2) {
      ctx.fillRect(px + 7, py + 27, 3, 5);
      ctx.fillRect(px + 14, py + 27, 3, 5);
    } else if (walk === 1) {
      ctx.fillRect(px + 6, py + 27, 3, 5);
      ctx.fillRect(px + 15, py + 26, 3, 5);
    } else {
      ctx.fillRect(px + 7, py + 26, 3, 5);
      ctx.fillRect(px + 14, py + 27, 3, 5);
    }
  } else {
    // Static stance for idle, forehand, backhand, serve
    ctx.fillRect(px + 7, py + 27, 3, 5);
    ctx.fillRect(px + 14, py + 27, 3, 5);
  }

  // --- Shoes ---
  ctx.fillStyle = PALETTE.SHOE_WHITE;
  if (state === 'walk') {
    const walk = Math.floor(frame) % 4;
    if (walk === 0 || walk === 2) {
      ctx.fillRect(px + 6, py + 32, 4, 2);
      ctx.fillRect(px + 14, py + 32, 4, 2);
    } else if (walk === 1) {
      ctx.fillRect(px + 5, py + 32, 4, 2);
      ctx.fillRect(px + 15, py + 31, 4, 2);
    } else {
      ctx.fillRect(px + 7, py + 31, 4, 2);
      ctx.fillRect(px + 13, py + 32, 4, 2);
    }
  } else {
    ctx.fillRect(px + 6, py + 32, 4, 2);
    ctx.fillRect(px + 14, py + 32, 4, 2);
  }

  // --- Shorts / Skirt ---
  if (gender === 'female') {
    // Skirt — wider, A-line shape, white
    ctx.fillStyle = '#f0f0f0';
    ctx.fillRect(px + 5, py + 22, 14, 3);    // top of skirt (same width as torso)
    ctx.fillRect(px + 4, py + 25, 16, 2);    // flared bottom (wider)
    ctx.fillRect(px + 3, py + 27, 18, 1);    // hem (widest)
    // Skirt shadow/fold detail
    ctx.fillStyle = '#d0d0d0';
    ctx.fillRect(px + 8, py + 23, 1, 4);     // center fold
    ctx.fillRect(px + 14, py + 23, 1, 4);    // right fold
  } else {
    // Shorts — dark, standard
    ctx.fillStyle = PALETTE.SHORTS_DARK;
    ctx.fillRect(px + 6, py + 22, 12, 5);
    ctx.fillStyle = 'rgba(0,0,0,0.1)';
    ctx.fillRect(px + 6, py + 22, 1, 5);
  }

  // --- Torso (avatar color) ---
  ctx.fillStyle = color;
  ctx.fillRect(px + 5, py + 11, 14, 11);
  // Collar
  ctx.fillStyle = PALETTE.SHIRT_WHITE;
  ctx.fillRect(px + 8, py + 11, 8, 2);
  // Side shading
  ctx.fillStyle = 'rgba(0,0,0,0.15)';
  ctx.fillRect(px + 5, py + 13, 2, 9);
  ctx.fillRect(px + 17, py + 13, 2, 9);
  // Number on back (when facing up)
  if (facing === 'up') {
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.fillRect(px + 10, py + 15, 4, 5);
  }

  // --- Head (rounded 10x9) ---
  ctx.fillStyle = PALETTE.SKIN_LIGHT;
  ctx.fillRect(px + 7, py + 3, 10, 8);
  ctx.fillRect(px + 8, py + 2, 8, 1);
  ctx.fillRect(px + 8, py + 11, 8, 1);
  // Ears
  if (facing !== 'up') {
    ctx.fillRect(px + 6, py + 5, 1, 3);
    ctx.fillRect(px + 17, py + 5, 1, 3);
  }

  // --- Hair ---
  if (gender === 'female') {
    // Female: longer hair flowing down sides + ponytail
    ctx.fillStyle = '#6b3a2a';
    ctx.fillRect(px + 7, py - 1, 10, 4);       // top hair, thicker
    ctx.fillRect(px + 8, py - 2, 8, 1);        // top peak
    // Side hair flowing down past ears
    ctx.fillRect(px + 6, py + 2, 2, 6);        // left side hair
    ctx.fillRect(px + 16, py + 2, 2, 6);       // right side hair
    // Ponytail (visible from all angles)
    ctx.fillRect(px + 10, py - 3, 4, 1);
    ctx.fillRect(px + 11, py - 4, 2, 1);
    if (facing === 'up') {
      // Ponytail hanging down the back
      ctx.fillRect(px + 10, py - 3, 4, 2);
      ctx.fillRect(px + 11, py - 5, 2, 2);
    }
  } else {
    // Male: short cropped hair
    ctx.fillStyle = '#4a3728';
    ctx.fillRect(px + 7, py, 10, 3);
    ctx.fillRect(px + 8, py - 1, 8, 1);
    ctx.fillRect(px + 7, py + 3, 1, 2);
    ctx.fillRect(px + 16, py + 3, 1, 2);
  }

  // --- Headband ---
  ctx.fillStyle = avatarIndex % 2 === 0 ? (PALETTE.HEADBAND_RED || '#d62828') : (PALETTE.HEADBAND_BLUE || '#0077b6');
  ctx.fillRect(px + 7, py + 3, 10, 2);

  // --- Face ---
  if (facing !== 'up') {
    ctx.fillStyle = '#1a1a2e';
    ctx.fillRect(px + 9, py + 6, 2, 2);        // left eye
    ctx.fillRect(px + 13, py + 6, 2, 2);       // right eye
    ctx.fillStyle = '#fff';
    ctx.fillRect(px + 9, py + 6, 1, 1);        // eye highlight
    ctx.fillRect(px + 13, py + 6, 1, 1);
    if (gender === 'female') {
      // Eyelashes (1px above each eye)
      ctx.fillStyle = '#1a1a2e';
      ctx.fillRect(px + 9, py + 5, 2, 1);
      ctx.fillRect(px + 13, py + 5, 2, 1);
      // Lips (pink, slightly wider than male mouth)
      ctx.fillStyle = '#e07080';
      ctx.fillRect(px + 10, py + 9, 4, 1);
    } else if (facing === 'down') {
      ctx.fillStyle = '#1a1a2e';
      ctx.fillRect(px + 10, py + 9, 4, 1);     // male mouth
    }
  }

  // --- Arms + Paddle (state-dependent) ---
  switch (state) {
    case 'forehand':
      drawForehandArms(ctx, px, py, facing, frame);
      break;
    case 'backhand':
      drawBackhandArms(ctx, px, py, facing, frame);
      break;
    case 'serve':
      drawServeArms(ctx, px, py, facing, frame);
      break;
    case 'walk':
      drawIdleArms(ctx, px, py, facing);
      break;
    case 'idle':
    default:
      drawIdleArms(ctx, px, py, facing);
      break;
  }
}

// --- Idle / Walk arms: paddle held at right side, arm down ---
function drawIdleArms(ctx, px, py, facing) {
  ctx.fillStyle = PALETTE.SKIN_LIGHT;

  if (facing === 'left') {
    // Left arm (paddle side)
    ctx.fillRect(px + 2, py + 13, 3, 7);
    // Right arm
    ctx.fillRect(px + 19, py + 14, 3, 6);
    // Paddle
    drawPaddle(ctx, px - 3, py + 10, 6, 8);
    // Handle
    ctx.fillStyle = '#8b4513';
    ctx.fillRect(px + 1, py + 18, 2, 3);
  } else if (facing === 'right') {
    // Right arm (paddle side)
    ctx.fillRect(px + 19, py + 13, 3, 7);
    // Left arm
    ctx.fillRect(px + 2, py + 14, 3, 6);
    // Paddle
    drawPaddle(ctx, px + 21, py + 10, 6, 8);
    ctx.fillStyle = '#8b4513';
    ctx.fillRect(px + 21, py + 18, 2, 3);
  } else if (facing === 'up') {
    // Left arm
    ctx.fillRect(px + 2, py + 14, 3, 6);
    // Right arm (paddle side)
    ctx.fillRect(px + 19, py + 12, 3, 6);
    // Paddle
    drawPaddle(ctx, px + 20, py + 7, 6, 8);
    ctx.fillStyle = '#8b4513';
    ctx.fillRect(px + 22, py + 15, 2, 3);
  } else {
    // Facing down
    ctx.fillRect(px + 2, py + 14, 3, 6);
    ctx.fillRect(px + 19, py + 14, 3, 6);
    drawPaddle(ctx, px + 22, py + 12, 6, 8);
    ctx.fillStyle = '#8b4513';
    ctx.fillRect(px + 22, py + 20, 2, 3);
  }
}

// --- Forehand: 3 frames (windUp=0, contact=1, followThrough=2) ---
function drawForehandArms(ctx, px, py, facing, frame) {
  ctx.fillStyle = PALETTE.SKIN_LIGHT;

  if (frame === 0) {
    // Wind up: right arm pulled back behind body, paddle behind at px+20, tilted
    // Left arm forward for balance
    ctx.fillRect(px + 1, py + 13, 4, 5);   // left arm forward
    ctx.fillRect(px + 19, py + 12, 4, 6);  // right arm pulled back
    drawPaddle(ctx, px + 20, py + 8, 6, 8);
    ctx.fillStyle = '#8b4513';
    ctx.fillRect(px + 21, py + 16, 2, 3);
  } else if (frame === 1) {
    // Contact: right arm extended forward-right, paddle fully extended
    // Bigger paddle on contact (7x9)
    ctx.fillRect(px + 2, py + 14, 3, 5);   // left arm at side
    ctx.fillRect(px + 18, py + 11, 6, 4);  // right arm fully extended
    drawPaddle(ctx, px + 22, py + 10, 7, 9);
    ctx.fillStyle = '#8b4513';
    ctx.fillRect(px + 24, py + 19, 2, 3);
    // Motion lines behind paddle
    drawMotionLines(ctx, px + 17, py + 13, 'left');
  } else {
    // Follow through: right arm swung across body to the left
    ctx.fillRect(px + 2, py + 15, 3, 5);   // left arm relaxed
    ctx.fillRect(px + 4, py + 13, 6, 4);   // right arm crossed over
    drawPaddle(ctx, px - 2, py + 12, 6, 8);
    ctx.fillStyle = '#8b4513';
    ctx.fillRect(px + 2, py + 20, 2, 3);
  }
}

// --- Backhand: 3 frames, mirror of forehand on LEFT side ---
function drawBackhandArms(ctx, px, py, facing, frame) {
  ctx.fillStyle = PALETTE.SKIN_LIGHT;

  if (frame === 0) {
    // Wind up: left arm pulled back behind body, paddle behind at px-4
    // Right arm forward for balance
    ctx.fillRect(px + 19, py + 13, 4, 5);  // right arm forward
    ctx.fillRect(px + 1, py + 12, 4, 6);   // left arm pulled back
    drawPaddle(ctx, px - 4, py + 8, 6, 8);
    ctx.fillStyle = '#8b4513';
    ctx.fillRect(px - 1, py + 16, 2, 3);
  } else if (frame === 1) {
    // Contact: left arm extended forward-left, paddle at px-6, py+10
    // Bigger paddle on contact (7x9)
    ctx.fillRect(px + 19, py + 14, 3, 5);  // right arm at side
    ctx.fillRect(px, py + 11, 6, 4);       // left arm fully extended
    drawPaddle(ctx, px - 6, py + 10, 7, 9);
    ctx.fillStyle = '#8b4513';
    ctx.fillRect(px - 4, py + 19, 2, 3);
    // Motion lines behind paddle
    drawMotionLines(ctx, px + 3, py + 13, 'right');
  } else {
    // Follow through: left arm swung across to the right
    ctx.fillRect(px + 19, py + 15, 3, 5);  // right arm relaxed
    ctx.fillRect(px + 14, py + 13, 6, 4);  // left arm crossed over
    drawPaddle(ctx, px + 18, py + 12, 6, 8);
    ctx.fillStyle = '#8b4513';
    ctx.fillRect(px + 20, py + 20, 2, 3);
  }
}

// --- Serve: 2 frames (toss=0, strike=1) ---
function drawServeArms(ctx, px, py, facing, frame) {
  ctx.fillStyle = PALETTE.SKIN_LIGHT;

  if (frame === 0) {
    // Toss: both arms up, left arm holds ball above head, right arm pulled back with paddle
    ctx.fillRect(px + 3, py + 6, 3, 8);    // left arm raised up
    ctx.fillRect(px + 18, py + 8, 3, 7);   // right arm pulled back with paddle
    // Ball above left hand (small yellow dot)
    ctx.fillStyle = PALETTE.BALL_YELLOW || '#f9c74f';
    ctx.fillRect(px + 3, py + 2, 3, 3);
    // Paddle held back
    drawPaddle(ctx, px + 19, py + 4, 6, 8);
    ctx.fillStyle = '#8b4513';
    ctx.fillRect(px + 20, py + 12, 2, 3);
  } else {
    // Strike: right arm fully extended upward, paddle at top, ball leaving
    ctx.fillRect(px + 3, py + 12, 3, 6);   // left arm back down
    ctx.fillRect(px + 18, py + 2, 3, 10);  // right arm fully extended up
    // Paddle at top
    drawPaddle(ctx, px + 19, py - 4, 6, 8);
    ctx.fillStyle = '#8b4513';
    ctx.fillRect(px + 20, py + 4, 2, 3);
  }
}

// --- Helper: draw paddle face + edge highlight ---
function drawPaddle(ctx, x, y, w, h) {
  ctx.fillStyle = '#44cc44';
  ctx.fillRect(x, y, w, h);
  ctx.fillStyle = '#66ee66';
  ctx.fillRect(x, y, w, 1);
}

// --- Helper: draw motion lines (2-3 trailing dots) ---
function drawMotionLines(ctx, x, y, direction) {
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  const dx = direction === 'left' ? -3 : 3;
  ctx.fillRect(x, y, 1, 1);
  ctx.fillRect(x + dx, y - 2, 1, 1);
  ctx.fillRect(x + dx * 2, y + 1, 1, 1);
}

let ballTrail = [];

function drawBallSprite(ctx, x, y, z, vx = 0, vy = 0) {
  const px = Math.floor(x);
  const py = Math.floor(y);
  const height = Math.max(0, z);
  const ballRise = Math.floor(height * 0.3); // pixels the ball rises visually

  ballTrail.push({ x: px, y: py });
  if (ballTrail.length > 5) ballTrail.shift();

  // Trail (follows the elevated ball position)
  for (let i = 0; i < ballTrail.length - 1; i++) {
    const t = ballTrail[i];
    const alpha = (i + 1) / ballTrail.length * 0.25;
    const size = Math.max(1, Math.floor(3 * (i + 1) / ballTrail.length));
    ctx.fillStyle = `rgba(249, 199, 79, ${alpha})`;
    ctx.fillRect(t.x + 1, t.y + 1 - ballRise, size, size);
  }

  // === GROUND SHADOW (stays at ground, GROWS larger + fainter with height) ===
  const shadowGrow = 1.0 + height * 0.02; // shadow spreads with height
  const shadowAlpha = Math.max(0.06, 0.45 - height * 0.003); // fainter with height
  const shadowW = Math.max(4, Math.floor(8 * shadowGrow));
  const shadowH = Math.max(2, Math.floor(3 * shadowGrow));
  const shadowX = px + 3 - Math.floor(shadowW / 2);
  const shadowY = py + 4;

  // Elliptical shadow with soft edges
  ctx.fillStyle = `rgba(0,0,0,${shadowAlpha * 0.5})`;
  ctx.fillRect(shadowX - 1, shadowY, shadowW + 2, shadowH); // outer
  ctx.fillStyle = `rgba(0,0,0,${shadowAlpha})`;
  ctx.fillRect(shadowX, shadowY, shadowW, shadowH);          // inner
  if (shadowH > 1) {
    ctx.fillStyle = `rgba(0,0,0,${shadowAlpha * 0.7})`;
    ctx.fillRect(shadowX + 1, shadowY + 1, shadowW - 2, shadowH - 1);
  }

  // === Vertical line connecting ball to shadow (height indicator) ===
  if (ballRise > 4) {
    ctx.fillStyle = `rgba(0,0,0,${Math.min(0.15, shadowAlpha * 0.3)})`;
    ctx.fillRect(px + 3, py + 3 - ballRise, 1, ballRise);
  }

  // === BALL (elevated by height) ===
  const ballY = py - ballRise;
  ctx.fillStyle = PALETTE.BALL_YELLOW;
  ctx.fillRect(px + 1, ballY, 4, 6);
  ctx.fillRect(px, ballY + 1, 6, 4);

  // Seam
  ctx.fillStyle = '#e0a030';
  ctx.fillRect(px + 3, ballY + 3, 1, 2);
  ctx.fillRect(px + 2, ballY + 4, 1, 1);

  // Highlight
  ctx.fillStyle = '#fff';
  ctx.fillRect(px + 1, ballY + 1, 2, 1);
  ctx.fillRect(px + 1, ballY + 2, 1, 1);

  // Glow at high altitude (lobs)
  if (height > 30) {
    ctx.fillStyle = 'rgba(255,255,200,0.15)';
    ctx.fillRect(px - 1, ballY - 1, 8, 8);
  }
}

function resetBallTrail() {
  ballTrail = [];
}

// ============================================================
// AUDIO ENGINE — Web Audio API, procedural chiptune
// ============================================================

let audioCtx = null;
let masterGain = null;
let musicGain = null;
let sfxGain = null;
let musicEnabled = true;
let sfxEnabled = true;
let currentBGM = null;
let initialized = false;

function ensureInit() {
  if (initialized) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  masterGain = audioCtx.createGain();
  masterGain.connect(audioCtx.destination);

  musicGain = audioCtx.createGain();
  musicGain.gain.value = 0.3;
  musicGain.connect(masterGain);

  sfxGain = audioCtx.createGain();
  sfxGain.gain.value = 0.5;
  sfxGain.connect(masterGain);

  initialized = true;
}

function initAudio() {
  // Called on first user interaction
  ensureInit();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playTone(freq, duration, type = 'square', gainNode = sfxGain, volume = 0.3) {
  if (!initialized) return;
  const osc = audioCtx.createOscillator();
  const env = audioCtx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  env.gain.value = volume;
  env.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  osc.connect(env);
  env.connect(gainNode);
  osc.start();
  osc.stop(audioCtx.currentTime + duration);
}

// SFX
const SFX = {
  hit: () => playTone(440, 0.08, 'square'),
  bounce: () => playTone(330, 0.06, 'triangle'),
  fault: () => {
    playTone(150, 0.3, 'square', sfxGain, 0.4);
    setTimeout(() => playTone(100, 0.3, 'square', sfxGain, 0.3), 150);
  },
  point: () => {
    playTone(523, 0.1, 'square');
    setTimeout(() => playTone(659, 0.1, 'square'), 100);
    setTimeout(() => playTone(784, 0.15, 'square'), 200);
  },
  menuMove: () => playTone(600, 0.04, 'square', sfxGain, 0.15),
  menuSelect: () => playTone(800, 0.08, 'square', sfxGain, 0.2),
  serve: () => playTone(350, 0.12, 'triangle'),
  win: () => {
    [523, 659, 784, 1047].forEach((f, i) => {
      setTimeout(() => playTone(f, 0.2, 'square', sfxGain, 0.3), i * 120);
    });
  },
};

function playSFX(name) {
  if (!sfxEnabled || !SFX[name]) return;
  ensureInit();
  SFX[name]();
}

// BGM — simple looping arpeggios
let bgmInterval = null;

const BGM_PATTERNS = {
  title: {
    notes: [262, 330, 392, 523, 392, 330],
    tempo: 200,
    type: 'triangle',
    volume: 0.15,
  },
  gameplay: {
    notes: [330, 392, 440, 523, 440, 392, 349, 330],
    tempo: 140,
    type: 'square',
    volume: 0.1,
  },
  victory: {
    notes: [523, 659, 784, 1047, 784, 659],
    tempo: 180,
    type: 'triangle',
    volume: 0.2,
  },
};

function playBGM(track) {
  if (!musicEnabled) return;
  ensureInit();
  stopBGM();
  const pattern = BGM_PATTERNS[track];
  if (!pattern) return;
  let idx = 0;
  currentBGM = track;
  bgmInterval = setInterval(() => {
    if (!musicEnabled) return;
    playTone(pattern.notes[idx], pattern.tempo / 1000 * 0.8, pattern.type, musicGain, pattern.volume);
    idx = (idx + 1) % pattern.notes.length;
  }, pattern.tempo);
}

function stopBGM() {
  if (bgmInterval) clearInterval(bgmInterval);
  bgmInterval = null;
  currentBGM = null;
}

function toggleMusic() {
  musicEnabled = !musicEnabled;
  if (!musicEnabled) stopBGM();
  return musicEnabled;
}

function toggleSFX() {
  sfxEnabled = !sfxEnabled;
  return sfxEnabled;
}

function isMusicEnabled() { return musicEnabled; }
function isSFXEnabled() { return sfxEnabled; }

// === src/physics.js ===
// ============================================================
// BALL PHYSICS ENGINE
// ============================================================


function createBall() {
  return {
    x: 0, y: 0,
    z: 0,             // virtual height
    vx: 0, vy: 0,
    vz: 0,
    active: false,
    bounced: false,    // has bounced on current side
    lastHitBy: null,   // 'player' or 'opponent'
    landed: false,     // ball has come to rest
    netCooldown: 0,    // seconds to ignore net collision after a hit
    prevY: 0,          // previous Y for swept net detection
    bouncedInCourt: false, // once true, ball can't be called out-of-bounds
  };
}

function updateBall(ball, dt) {
  if (!ball.active || ball.landed) return;

  // Store previous Y for swept net detection
  ball.prevY = ball.y;

  // Apply velocity
  ball.x += ball.vx * dt;
  ball.y += ball.vy * dt;

  // Gravity on z
  ball.vz += BALL.GRAVITY * dt;
  ball.z += ball.vz * dt;

  // Net cooldown countdown
  if (ball.netCooldown > 0) ball.netCooldown -= dt;

  // Bounce off ground
  if (ball.z <= 0) {
    ball.z = 0;

    // Check if this bounce is inside the court
    const inCourtX = ball.x >= COURT.X && ball.x <= COURT.X + COURT.WIDTH;
    const inCourtY = ball.y >= COURT.Y && ball.y <= COURT.Y + COURT.HEIGHT;
    if (inCourtX && inCourtY) {
      ball.bouncedInCourt = true; // ball is in play — can't be called out anymore
    }

    if (Math.abs(ball.vz) < 15) {
      ball.vz = 0;
      ball.landed = true;
    } else {
      ball.vz = Math.abs(ball.vz) * BALL.BOUNCE_DAMPING;
      ball.bounced = true;
    }
    ball.vx *= 0.85;
    ball.vy *= 0.85;
  }

  return checkBallBoundaries(ball);
}

function checkBallBoundaries(ball) {
  const result = { netHit: false, outOfBounds: false, side: null };

  // Net collision — swept detection: did ball cross NET_Y while below net height?
  if (ball.z < BALL.NET_HEIGHT && ball.netCooldown <= 0) {
    const netY = COURT.NET_Y;
    const crossedNet = (ball.prevY < netY && ball.y >= netY) ||
                       (ball.prevY > netY && ball.y <= netY);
    if (crossedNet && ball.x >= COURT.X && ball.x <= COURT.X + COURT.WIDTH) {
      result.netHit = true;
      // Kill the ball at the net
      ball.y = netY;
      ball.vx *= 0.15;
      ball.vy = 0;
      ball.vz = 5;
      ball.netCooldown = 2.0;
    }
  }

  // Out of bounds — only if ball hasn't already bounced in court
  // (in pickleball, where the ball BOUNCES matters, not where it rolls to)
  if (!ball.bouncedInCourt) {
    if (ball.x < COURT.X - 5 || ball.x > COURT.X + COURT.WIDTH + 5) {
      result.outOfBounds = true;
    }
    if (ball.y < COURT.Y - 5 || ball.y > COURT.Y + COURT.HEIGHT + 5) {
      result.outOfBounds = true;
    }
  }

  result.side = ball.y < COURT.NET_Y ? 'opponent' : 'player';
  return result;
}

function serveBall(ball, fromX, fromY, targetX, targetY, server = 'player') {
  ball.x = fromX;
  ball.y = fromY;
  ball.z = 8;
  ball.active = true;
  ball.bounced = false;
  ball.landed = false;
  ball.netCooldown = 0.3;
  ball.lastHitBy = server;

  // Use the same "land at target" physics as hitBall
  const dx = targetX - fromX;
  const dy = targetY - fromY;
  const dist = Math.sqrt(dx * dx + dy * dy) || 1;
  const g = Math.abs(BALL.GRAVITY);

  // Serve flight time ~1.0s
  const flightTime = 1.0;
  let vz = 0.5 * g * flightTime;
  // Ensure net clearance
  const minVz = Math.sqrt(2 * g * (BALL.NET_HEIGHT + 10));
  vz = Math.max(vz, minVz);

  const actualFlightTime = 2 * vz / g;
  const hSpeed = dist / Math.max(actualFlightTime, 0.1);

  ball.vx = (dx / dist) * hSpeed;
  ball.vy = (dy / dist) * hSpeed;
  ball.vz = vz;
}

function hitBall(ball, targetX, targetY, flightTime, arcMult, safeNet = true) {
  // Ball lands at the target. Speed determined by flight time.
  // flightTime: seconds in air (0.3=smash, 0.7=drive, 1.6=lob)
  // arcMult: height multiplier (1.0=flat, 2.5=lob)
  // safeNet: true=guarantee net clearance (soft shots), false=flat & risky (hard shots)

  const dx = targetX - ball.x;
  const dy = targetY - ball.y;
  const dist = Math.sqrt(dx * dx + dy * dy) || 1;
  const g = Math.abs(BALL.GRAVITY);
  const ft = Math.max(flightTime, 0.2);

  // Base vz from desired flight time
  let vz = 0.5 * g * ft;

  // Net clearance — accounts for ball's current height
  const crossesNet = (ball.y < COURT.NET_Y && targetY > COURT.NET_Y) ||
                     (ball.y > COURT.NET_Y && targetY < COURT.NET_Y);
  if (crossesNet) {
    const heightNeeded = Math.max(BALL.NET_HEIGHT - ball.z, 0);
    if (safeNet) {
      // Soft shots: generous margin
      const minVz = Math.sqrt(2 * g * (heightNeeded + 8));
      vz = Math.max(vz, minVz);
    } else if (heightNeeded > 0) {
      // Hard shots: minimal boost only if ball is below net
      // If ball is already above net (smash), NO boost → full speed
      const minVz = Math.sqrt(2 * g * (heightNeeded + 1));
      vz = Math.max(vz, minVz);
    }
  }

  // Apply arc multiplier
  vz *= Math.max(arcMult || 1.0, 1.0);

  // Horizontal speed from actual flight time → ball lands at target
  const actualFT = 2 * vz / g;
  const hSpeed = dist / Math.max(actualFT, 0.1);

  ball.vx = (dx / dist) * hSpeed;
  ball.vy = (dy / dist) * hSpeed;
  ball.vz = vz;
  ball.z = Math.max(ball.z, 3);
  ball.bounced = false;
  ball.landed = false;
  ball.bouncedInCourt = false; // reset — new trajectory needs fresh OOB check
  ball.netCooldown = 0.2;
}

function isInKitchen(x, y) {
  return x >= COURT.X && x <= COURT.X + COURT.WIDTH &&
         y >= COURT.NET_Y - COURT.KITCHEN_DEPTH && y <= COURT.NET_Y + COURT.KITCHEN_DEPTH;
}

function getBallSide(ball) {
  return ball.y < COURT.NET_Y ? 'opponent' : 'player';
}

// Predict where ball will land (used by AI and landing marker)
function predictLanding(ball) {
  let px = ball.x, py = ball.y, pz = ball.z, pvz = ball.vz;
  let pvx = ball.vx, pvy = ball.vy;
  const dt = 1 / 60;
  for (let i = 0; i < 180; i++) {
    pvz += BALL.GRAVITY * dt;
    pz += pvz * dt;
    px += pvx * dt;
    py += pvy * dt;
    if (pz <= 0) {
      // Apply ground friction on first bounce (matches updateBall)
      pvx *= 0.85;
      pvy *= 0.85;
      return { x: px, y: py };
    }
  }
  return { x: px, y: py };
}

// === src/rules.js ===
// ============================================================
// PICKLEBALL RULES ENGINE
// ============================================================


const ServeState = {
  WAITING: 'WAITING',
  SERVED: 'SERVED',
  IN_PLAY: 'IN_PLAY',
};

const FaultReason = {
  NET: 'NET FAULT',
  OUT: 'OUT OF BOUNDS',
  KITCHEN_SERVE: 'SERVE IN KITCHEN',
  KITCHEN_VOLLEY: 'KITCHEN VOLLEY',
  DOUBLE_BOUNCE: 'DOUBLE BOUNCE VIOLATION',
  NOT_RETURNED: 'NOT RETURNED',
};

function createRulesState() {
  return {
    serveState: ServeState.WAITING,
    serving: 'player',         // who is serving
    bounceCount: { player: 0, opponent: 0 },
    doubleBounceCleared: { player: false, opponent: false },
    rallyCount: 0,
    lastFault: null,
    lastFaultReason: null,
  };
}

function resetForServe(rules, serving) {
  rules.serveState = ServeState.WAITING;
  rules.bounceCount = { player: 0, opponent: 0 };
  rules.doubleBounceCleared = { player: false, opponent: false };
  rules.rallyCount = 0;
  rules.lastFault = null;
  rules.lastFaultReason = null;
  if (serving !== undefined) {
    rules.serving = serving;
  }
}

function onServe(rules) {
  rules.serveState = ServeState.SERVED;
}

function onBallBounce(rules, side) {
  rules.bounceCount[side]++;

  // After serve: ball must bounce on receiver's side (first bounce)
  // Then receiver hits it back, and it must bounce on server's side (second bounce)
  // After both sides have had one bounce, the double-bounce rule is cleared
  if (rules.serveState === ServeState.SERVED) {
    rules.serveState = ServeState.IN_PLAY;
  }
}

function onBallHit(rules, hitter) {
  rules.rallyCount++;

  // Two-bounce rule (pickleball):
  // Rally hit 1 = receiver returning serve → ball MUST have bounced on their side
  // Rally hit 2 = server returning the return → ball MUST have bounced on their side
  // After that, volleys are allowed
  if (rules.rallyCount <= 2 && !rules.doubleBounceCleared[hitter]) {
    if (rules.bounceCount[hitter] === 0) {
      return { fault: true, reason: FaultReason.DOUBLE_BOUNCE, against: hitter };
    }
  }

  // Once you've let it bounce, mark rule as cleared for this player
  if (rules.bounceCount[hitter] > 0) {
    rules.doubleBounceCleared[hitter] = true;
  }

  // Reset bounce count for the other side (they need a fresh bounce)
  const otherSide = hitter === 'player' ? 'opponent' : 'player';
  rules.bounceCount[otherSide] = 0;

  return { fault: false };
}

function checkKitchenVolley(hitter, hitterY, bounceCount) {
  // Kitchen/NVZ rule: you CANNOT volley while standing in the kitchen.
  // Volleying = hitting the ball before it bounces on YOUR side.
  // You CAN enter the kitchen and hit if the ball has bounced there.
  //
  // Player's kitchen: NET_Y to NET_Y + KITCHEN_DEPTH
  // Opponent's kitchen: NET_Y - KITCHEN_DEPTH to NET_Y

  const inKitchen = hitter === 'player'
    ? hitterY >= COURT.NET_Y && hitterY <= COURT.NET_Y + COURT.KITCHEN_DEPTH
    : hitterY >= COURT.NET_Y - COURT.KITCHEN_DEPTH && hitterY <= COURT.NET_Y;

  if (!inKitchen) return { fault: false };

  // In the kitchen — only a fault if the ball hasn't bounced on their side (volley)
  if (bounceCount === 0) {
    return { fault: true, reason: FaultReason.KITCHEN_VOLLEY, against: hitter };
  }

  // Ball bounced on their side — legal to hit from kitchen
  return { fault: false };
}

function checkServeLanding(ball, serveSide, server = 'player') {
  // Serve must land in the diagonal service box, past the kitchen
  const inCourt = ball.x >= COURT.X && ball.x <= COURT.X + COURT.WIDTH;

  if (server === 'player') {
    // Player serves to opponent side (top half): y >= COURT.Y and y < NET_Y - KITCHEN_DEPTH
    const pastKitchen = ball.y < COURT.NET_Y - COURT.KITCHEN_DEPTH;
    const inBounds = ball.y >= COURT.Y;

    if (!inCourt || !inBounds) {
      return { fault: true, reason: FaultReason.OUT };
    }
    if (!pastKitchen) {
      return { fault: true, reason: FaultReason.KITCHEN_SERVE };
    }

    // Check correct service box (left/right) — opponent's perspective
    const centerX = COURT.CENTER_X;
    if (serveSide === 'right' && ball.x > centerX) {
      return { fault: true, reason: FaultReason.OUT };
    }
    if (serveSide === 'left' && ball.x < centerX) {
      return { fault: true, reason: FaultReason.OUT };
    }
  } else {
    // Opponent serves to player side (bottom half): y > NET_Y + KITCHEN_DEPTH and y <= COURT.Y + COURT.HEIGHT
    const pastKitchen = ball.y > COURT.NET_Y + COURT.KITCHEN_DEPTH;
    const inBounds = ball.y <= COURT.Y + COURT.HEIGHT;

    if (!inCourt || !inBounds) {
      return { fault: true, reason: FaultReason.OUT };
    }
    if (!pastKitchen) {
      return { fault: true, reason: FaultReason.KITCHEN_SERVE };
    }

    // Check correct service box (left/right) — player's perspective
    const centerX = COURT.CENTER_X;
    if (serveSide === 'right' && ball.x < centerX) {
      return { fault: true, reason: FaultReason.OUT };
    }
    if (serveSide === 'left' && ball.x > centerX) {
      return { fault: true, reason: FaultReason.OUT };
    }
  }

  return { fault: false };
}

function getServeSide(score, server) {
  const serverScore = score[server];
  return serverScore % 2 === 0 ? 'right' : 'left';
}

function scorePoint(score, rules, pointWinner) {
  // Side-out scoring (real pickleball):
  // - Only the SERVER can score
  // - If server wins rally → server gets point + keeps serving
  // - If receiver wins rally → no point, serve switches (side-out)
  if (pointWinner === score.serving) {
    // Server won → score a point, keep serving
    score[pointWinner]++;
  } else {
    // Receiver won → no point scored, serve switches
    score.serving = pointWinner;
  }
}

function checkGameOver(score) {
  const p = score.player;
  const o = score.opponent;
  const target = SCORING.POINTS_TO_WIN;
  const winBy = SCORING.WIN_BY;

  if (p >= target && p - o >= winBy) return 'player';
  if (o >= target && o - p >= winBy) return 'opponent';
  return null;
}

function checkMatchOver(score) {
  const needed = Math.ceil(SCORING.BEST_OF / 2);
  if (score.games[0] >= needed) return 'player';
  if (score.games[1] >= needed) return 'opponent';
  return null;
}

// === src/renderer.js ===

let courtBuffer = null;

function clearScreen(ctx, color = PALETTE.DARK_BLUE) {
  ctx.fillStyle = color;
  ctx.fillRect(0, 0, INTERNAL_WIDTH, INTERNAL_HEIGHT);
}

// Build court buffer once — call on init or resize
function buildCourtBuffer() {
  const canvas = document.createElement('canvas');
  canvas.width = INTERNAL_WIDTH;
  canvas.height = INTERNAL_HEIGHT;
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;

  // --- Helper: pseudo-random from coordinates (deterministic) ---
  function hash(x, y, seed) {
    return ((x * 73 + y * 137 + seed * 31) % 997 + 997) % 997;
  }

  // Fence boundary (10px outside court)
  const fenceX = COURT.X - 10;
  const fenceY = COURT.Y - 10;
  const fenceW = COURT.WIDTH + 20;
  const fenceH = COURT.HEIGHT + 20;
  // Gate center at bottom for the stone path
  const gateCenter = COURT.CENTER_X;
  const gateHalf = 4; // 8px gap

  // --- 1. Grass Base (3-shade 4x4 tile pattern) ---
  function drawGrass(c) {
    const GL = '#52b788';
    const GD = '#40916c';
    const GA = '#74c69d';

    for (let ty = 0; ty < INTERNAL_HEIGHT; ty += 4) {
      for (let tx = 0; tx < INTERNAL_WIDTH; tx += 4) {
        const tileIdx = (Math.floor(tx / 4) + Math.floor(ty / 4)) % 2;
        c.fillStyle = tileIdx === 0 ? GL : GD;
        c.fillRect(tx, ty, 4, 4);
        // L-shaped accent in corner for texture
        c.fillStyle = GA;
        if (tileIdx === 0) {
          c.fillRect(tx, ty, 2, 1);
          c.fillRect(tx, ty + 1, 1, 1);
        } else {
          c.fillRect(tx + 2, ty + 2, 2, 1);
          c.fillRect(tx + 3, ty + 3, 1, 1);
        }
      }
    }
    // Blade accent marks every 6px
    c.fillStyle = GA;
    for (let y = 0; y < INTERNAL_HEIGHT; y += 3) {
      for (let x = 0; x < INTERNAL_WIDTH; x += 6) {
        c.fillRect(x + (y % 2), y, 1, 1);
      }
    }
  }

  // --- 2. Stone Path (bottom center to court gate) ---
  function drawStonePath(c) {
    const pathW = 20;
    const pathX = gateCenter - pathW / 2;
    const pathTop = fenceY + fenceH; // bottom of fence
    const pathBottom = INTERNAL_HEIGHT;

    // Stone colors
    const stoneColor = '#d4b896';
    const mortarColor = '#a08060';
    const stoneHighlight = '#e0c8a8';

    // Fill mortar background
    c.fillStyle = mortarColor;
    c.fillRect(pathX, pathTop, pathW, pathBottom - pathTop);

    // Draw staggered stones
    for (let sy = pathTop; sy < pathBottom; sy += 4) {
      const row = Math.floor((sy - pathTop) / 4);
      const offset = (row % 2 === 0) ? 0 : 3;
      for (let sx = pathX + offset; sx < pathX + pathW; sx += 5) {
        const sw = Math.min(4, pathX + pathW - sx);
        if (sw <= 0) continue;
        c.fillStyle = stoneColor;
        c.fillRect(sx, sy, sw, 3);
        // Highlight on top edge
        c.fillStyle = stoneHighlight;
        c.fillRect(sx, sy, sw, 1);
      }
    }

    // Grass edge transition: darker green pixels on both sides
    c.fillStyle = '#3a7a5a';
    for (let y = pathTop; y < pathBottom; y += 2) {
      c.fillRect(pathX - 1, y, 1, 1);
      c.fillRect(pathX + pathW, y, 1, 1);
    }
  }

  // --- 3. Tree drawing function ---
  function drawTree(c, x, y, size) {
    // size: 'small' (8x12), 'medium' (12x18), 'large' (16x22)
    let cw, ch, tw, th;
    if (size === 'small') { cw = 8; ch = 7; tw = 3; th = 5; }
    else if (size === 'medium') { cw = 12; ch = 10; tw = 3; th = 8; }
    else { cw = 16; ch = 12; tw = 4; th = 10; }

    const trunkX = x + Math.floor(cw / 2) - Math.floor(tw / 2);
    const trunkY = y + ch - 2;

    // Trunk
    c.fillStyle = '#5c3a1a';
    c.fillRect(trunkX, trunkY, tw, th);
    // Trunk dark edge
    c.fillStyle = '#3d2710';
    c.fillRect(trunkX, trunkY, 1, th);

    // Canopy - outer (dark green)
    c.fillStyle = '#1e6b3a';
    c.fillRect(x, y + 2, cw, ch - 2);
    c.fillRect(x + 1, y + 1, cw - 2, 1);
    c.fillRect(x + 2, y, cw - 4, 1);

    // Canopy - middle (medium green)
    c.fillStyle = '#2d8f4e';
    c.fillRect(x + 2, y + 3, cw - 4, ch - 5);
    c.fillRect(x + 1, y + 2, cw - 2, ch - 5);

    // Canopy - inner highlight (light green, top area)
    c.fillStyle = '#4aba6e';
    c.fillRect(x + 2, y + 2, cw - 5, Math.floor(ch / 3));
    c.fillRect(x + 3, y + 1, cw - 7, 1);

    // Sunlight highlight dots (top-left)
    c.fillStyle = '#ffffff';
    c.fillRect(x + 3, y + 2, 1, 1);
    if (cw >= 12) {
      c.fillRect(x + 5, y + 1, 1, 1);
    }
  }

  // --- Tree shadow function ---
  function drawTreeShadow(c, x, y, size) {
    let cw, ch;
    if (size === 'small') { cw = 8; ch = 12; }
    else if (size === 'medium') { cw = 12; ch = 18; }
    else { cw = 16; ch = 22; }

    const shadowX = x + 2;
    const shadowY = y + ch - 2;
    const sw = cw - 2;
    const sh = Math.floor(cw / 3);

    c.fillStyle = 'rgba(0,0,0,0.15)';
    c.fillRect(shadowX + 1, shadowY, sw - 2, sh);
    c.fillRect(shadowX, shadowY + 1, sw, sh - 2);
  }

  // Tree positions: [x, y, size]
  const trees = [
    // Top row (above bleachers) - 5 trees
    [40, 2, 'large'],
    [100, 5, 'medium'],
    [200, 0, 'large'],
    [430, 3, 'medium'],
    [540, 1, 'large'],
    // Left side - 3 trees
    [20, 80, 'medium'],
    [10, 160, 'large'],
    [30, 240, 'medium'],
    // Right side - 3 trees
    [580, 90, 'medium'],
    [590, 180, 'large'],
    [570, 260, 'medium'],
    // Bottom corners - 2 trees
    [40, 310, 'medium'],
    [560, 315, 'medium'],
  ];

  // --- 4. Flower Beds ---
  function drawFlowerBeds(c) {
    const beds = [
      // Near the stone path (bottom area)
      { x: gateCenter + 16, y: INTERNAL_HEIGHT - 30, w: 14, h: 10 },
      { x: gateCenter - 30, y: INTERNAL_HEIGHT - 25, w: 12, h: 8 },
      // Near left trees
      { x: 55, y: 110, w: 12, h: 8 },
      // Near right trees
      { x: 560, y: 130, w: 14, h: 8 },
    ];

    const flowerColors = ['#e63946', '#f4d35e', '#ff69b4', '#ffffff', '#9b59b6'];

    for (const bed of beds) {
      // Soil base
      c.fillStyle = '#5c4033';
      c.fillRect(bed.x, bed.y, bed.w, bed.h);
      // Lighter inner soil
      c.fillStyle = '#6d4c3a';
      c.fillRect(bed.x + 1, bed.y + 1, bed.w - 2, bed.h - 2);

      // Flowers (3x3 cross shape)
      const numFlowers = 3 + hash(bed.x, bed.y, 7) % 2;
      for (let f = 0; f < numFlowers; f++) {
        const fx = bed.x + 2 + (f * Math.floor((bed.w - 4) / numFlowers));
        const fy = bed.y + 2 + hash(f, bed.x, 13) % (bed.h - 5);
        const fcolor = flowerColors[hash(fx, fy, 99) % flowerColors.length];
        // Center
        c.fillStyle = '#f4d35e';
        c.fillRect(fx + 1, fy + 1, 1, 1);
        // Petals (cross)
        c.fillStyle = fcolor;
        c.fillRect(fx + 1, fy, 1, 1);     // top
        c.fillRect(fx + 1, fy + 2, 1, 1); // bottom
        c.fillRect(fx, fy + 1, 1, 1);     // left
        c.fillRect(fx + 2, fy + 1, 1, 1); // right
      }
    }
  }

  // --- 5. Bushes ---
  function drawBushes(c) {
    const bushPositions = [
      [65, 50], [130, 15], [480, 10], [600, 100],
      [15, 200], [600, 220], [80, 290], [530, 300],
    ];

    for (const [bx, by] of bushPositions) {
      // Shadow
      c.fillStyle = '#2a6a3a';
      c.fillRect(bx, by + 3, 5, 1);
      // Main body
      c.fillStyle = '#3a8a50';
      c.fillRect(bx, by + 1, 5, 2);
      c.fillRect(bx + 1, by + 3, 3, 1);
      // Highlight top
      c.fillStyle = '#5ab06a';
      c.fillRect(bx + 1, by, 3, 1);
      c.fillRect(bx, by + 1, 5, 1);
    }
  }

  // --- 6. Bleachers (4 rows with 30+ spectators) ---
  function drawBleachers(c) {
    const bx = COURT.X;
    const bw = COURT.WIDTH;
    const bleachBottom = COURT.Y - 12; // just above fence

    // 4 rows of bench seats, 5px tall, 3px spacing
    const rowHeight = 5;
    const rowGap = 3;
    for (let r = 0; r < 4; r++) {
      const ry = bleachBottom - (r + 1) * (rowHeight + rowGap);
      // Bench seat
      c.fillStyle = '#b0b0b0'; // light top
      c.fillRect(bx, ry, bw, 1);
      c.fillStyle = '#9e9e9e'; // main gray
      c.fillRect(bx, ry + 1, bw, rowHeight - 2);
      c.fillStyle = '#7e7e7e'; // darker front edge
      c.fillRect(bx, ry + rowHeight - 1, bw, 1);
    }

    // 32 spectators across 4 rows
    const skinTones = ['#ffd5b0', '#d4a373', '#8d5524'];
    const shirtColors = ['#e63946', '#48cae4', '#f4d35e', '#ee6c4d', '#2d6a4f', '#9b59b6', '#f39c12', '#1abc9c'];
    const numSpectators = 32;
    const spacing = Math.floor(bw / (numSpectators / 4));

    for (let i = 0; i < numSpectators; i++) {
      const row = i % 4;
      const col = Math.floor(i / 4);
      const ry = bleachBottom - (row + 1) * (rowHeight + rowGap);
      const sx = bx + 4 + col * spacing + (hash(i, 0, 77) % 3) - 1;
      const baseY = ry - 7;

      // Head (2x2)
      c.fillStyle = skinTones[hash(i, 1, 33) % 3];
      c.fillRect(sx + 1, baseY, 2, 2);

      // Hat (every 4th)
      if (i % 4 === 0) {
        c.fillStyle = shirtColors[(i + 3) % shirtColors.length];
        c.fillRect(sx, baseY - 1, 4, 1);
      }

      // Body/shirt (3x3)
      c.fillStyle = shirtColors[i % shirtColors.length];
      c.fillRect(sx, baseY + 2, 4, 3);

      // Waving arms (every 6th)
      if (i % 6 === 2) {
        c.fillStyle = '#ffffff';
        c.fillRect(sx - 1, baseY + 1, 1, 1);
        c.fillRect(sx + 5, baseY + 1, 1, 1);
      }
    }
  }

  // --- 7. Banner & Signage ---
  function drawBanner(c) {
    const bannerY = 8;
    const poleH = 14;
    const poleLeftX = COURT.X + 20;
    const poleRightX = COURT.X + COURT.WIDTH - 22;
    const bannerX = poleLeftX + 2;
    const bannerW = poleRightX - poleLeftX - 2;

    // Poles
    c.fillStyle = '#444444';
    c.fillRect(poleLeftX, bannerY, 2, poleH);
    c.fillRect(poleRightX, bannerY, 2, poleH);
    // Pole caps
    c.fillStyle = '#666666';
    c.fillRect(poleLeftX - 1, bannerY, 4, 1);
    c.fillRect(poleRightX - 1, bannerY, 4, 1);

    // Banner cloth (purple background)
    c.fillStyle = '#2d1b69';
    c.fillRect(bannerX, bannerY + 2, bannerW, 7);
    // Top edge highlight
    c.fillStyle = '#3d2b79';
    c.fillRect(bannerX, bannerY + 2, bannerW, 1);
    // Bottom edge
    c.fillStyle = '#1d0b59';
    c.fillRect(bannerX, bannerY + 8, bannerW, 1);

    // "PICKLE SMASH" text centered on banner
    drawTextCentered(c, 'PICKLE SMASH', COURT.CENTER_X, bannerY + 3, PALETTE.YELLOW, 1);
  }

  // --- 8. White Picket Fence ---
  function drawFence(c) {
    const fx = fenceX;
    const fy = fenceY;
    const fw = fenceW;
    const fh = fenceH;

    const white = '#f0f0f0';
    const rail = '#d0d0d0';
    const shadow = '#c0c0c0';

    // Draw fence on all 4 sides
    // Horizontal rails at 3px and 6px from picket top
    function drawPicketRun(startX, endX, baseY, isHorizontal) {
      if (isHorizontal) {
        // Horizontal rail lines
        c.fillStyle = rail;
        c.fillRect(startX, baseY + 3, endX - startX, 1);
        c.fillRect(startX, baseY + 6, endX - startX, 1);

        // Vertical pickets every 6px
        for (let px = startX; px < endX; px += 6) {
          // Skip gate opening at bottom
          if (baseY > fy + fh / 2) { // bottom fence
            if (px >= gateCenter - gateHalf && px <= gateCenter + gateHalf) continue;
          }
          c.fillStyle = white;
          c.fillRect(px, baseY, 2, 8);
          // Pointed top (1px triangle)
          c.fillRect(px, baseY - 1, 2, 1);
          c.fillRect(px, baseY - 2, 1, 1); // tip
          // Shadow on right edge
          c.fillStyle = shadow;
          c.fillRect(px + 1, baseY + 1, 1, 7);
        }
      }
    }

    // Top fence
    drawPicketRun(fx, fx + fw, fy, true);
    // Bottom fence
    drawPicketRun(fx, fx + fw, fy + fh - 8, true);

    // Left side fence (vertical - draw rotated pickets)
    c.fillStyle = rail;
    c.fillRect(fx + 3, fy, 1, fh);
    c.fillRect(fx + 6, fy, 1, fh);
    for (let py = fy; py < fy + fh; py += 6) {
      c.fillStyle = white;
      c.fillRect(fx, py, 8, 2);
      c.fillRect(fx - 1, py, 1, 2);
      c.fillRect(fx - 2, py, 1, 1);
      c.fillStyle = shadow;
      c.fillRect(fx, py + 1, 8, 1);
    }

    // Right side fence
    c.fillStyle = rail;
    c.fillRect(fx + fw - 4, fy, 1, fh);
    c.fillRect(fx + fw - 7, fy, 1, fh);
    for (let py = fy; py < fy + fh; py += 6) {
      c.fillStyle = white;
      c.fillRect(fx + fw - 8, py, 8, 2);
      c.fillRect(fx + fw, py, 1, 2);
      c.fillRect(fx + fw + 1, py, 1, 1);
      c.fillStyle = shadow;
      c.fillRect(fx + fw - 8, py + 1, 8, 1);
    }
  }

  // --- 9. Court Surface ---
  function drawCourtSurface(c) {
    const CG = PALETTE.COURT_GREEN || '#2d6a4f';
    const CG_LIGHT = '#2f6f52';
    const CG_DARK = '#285e45';
    const courtShades = [CG, CG_LIGHT, CG_DARK];

    const KG = PALETTE.KITCHEN_GREEN || '#40916c';
    const KG_LIGHT = '#4a9b76';
    const KG_DARK = '#3a8562';
    const kitchenShades = [KG, KG_LIGHT, KG_DARK];

    // Main court: 3-shade subtle texture in 3x3 blocks
    for (let y = COURT.Y; y < COURT.Y + COURT.HEIGHT; y += 3) {
      for (let x = COURT.X; x < COURT.X + COURT.WIDTH; x += 3) {
        const inKitchen = (y >= COURT.NET_Y - COURT.KITCHEN_DEPTH && y < COURT.NET_Y) ||
                          (y >= COURT.NET_Y && y < COURT.NET_Y + COURT.KITCHEN_DEPTH);
        const shades = inKitchen ? kitchenShades : courtShades;
        const idx = (Math.floor(x / 3) + Math.floor(y / 3)) % 3;
        c.fillStyle = shades[idx];
        const w = Math.min(3, COURT.X + COURT.WIDTH - x);
        const h = Math.min(3, COURT.Y + COURT.HEIGHT - y);
        c.fillRect(x, y, w, h);
      }
    }

    // Kitchen crosshatch pattern
    c.fillStyle = 'rgba(255,255,255,0.06)';
    for (let y = COURT.NET_Y - COURT.KITCHEN_DEPTH; y < COURT.NET_Y; y += 4) {
      for (let x = COURT.X; x < COURT.X + COURT.WIDTH; x += 4) {
        c.fillRect(x + (y % 8 < 4 ? 0 : 2), y, 1, 1);
      }
    }
    for (let y = COURT.NET_Y; y < COURT.NET_Y + COURT.KITCHEN_DEPTH; y += 4) {
      for (let x = COURT.X; x < COURT.X + COURT.WIDTH; x += 4) {
        c.fillRect(x + (y % 8 < 4 ? 0 : 2), y, 1, 1);
      }
    }

    // Depth shading on court edges
    c.fillStyle = 'rgba(0,0,0,0.12)';
    c.fillRect(COURT.X, COURT.Y + COURT.HEIGHT - 3, COURT.WIDTH, 3);
    c.fillRect(COURT.X + COURT.WIDTH - 3, COURT.Y, 3, COURT.HEIGHT);
    c.fillStyle = 'rgba(255,255,255,0.06)';
    c.fillRect(COURT.X, COURT.Y, COURT.WIDTH, 2);
    c.fillRect(COURT.X, COURT.Y, 2, COURT.HEIGHT);

    // Service box labels
    const topLeftBoxCX = COURT.X + Math.floor((COURT.CENTER_X - COURT.X) / 2);
    const topRightBoxCX = COURT.CENTER_X + Math.floor((COURT.X + COURT.WIDTH - COURT.CENTER_X) / 2);
    const topBoxCY = COURT.Y + Math.floor((COURT.NET_Y - COURT.KITCHEN_DEPTH - COURT.Y) / 2);
    const botBoxCY = COURT.NET_Y + COURT.KITCHEN_DEPTH + Math.floor((COURT.Y + COURT.HEIGHT - COURT.NET_Y - COURT.KITCHEN_DEPTH) / 2);

    const labelColor = 'rgba(255,255,255,0.15)';
    drawTextCentered(c, 'R', topRightBoxCX, topBoxCY - 3, labelColor, 1);
    drawTextCentered(c, 'L', topLeftBoxCX, topBoxCY - 3, labelColor, 1);
    drawTextCentered(c, 'L', topRightBoxCX, botBoxCY - 3, labelColor, 1);
    drawTextCentered(c, 'R', topLeftBoxCX, botBoxCY - 3, labelColor, 1);
  }

  // --- Court lines ---
  function drawCourtLines(c) {
    c.fillStyle = PALETTE.LINE_WHITE;
    c.fillRect(COURT.X, COURT.Y, COURT.WIDTH, 1);
    c.fillRect(COURT.X, COURT.Y + COURT.HEIGHT - 1, COURT.WIDTH, 1);
    c.fillRect(COURT.X, COURT.Y, 1, COURT.HEIGHT);
    c.fillRect(COURT.X + COURT.WIDTH - 1, COURT.Y, 1, COURT.HEIGHT);
    c.fillRect(COURT.X, COURT.NET_Y - COURT.KITCHEN_DEPTH, COURT.WIDTH, 1);
    c.fillRect(COURT.X, COURT.NET_Y + COURT.KITCHEN_DEPTH, COURT.WIDTH, 1);
    const cx = COURT.X + Math.floor(COURT.WIDTH / 2);
    c.fillRect(cx, COURT.Y, 1, COURT.NET_Y - COURT.KITCHEN_DEPTH - COURT.Y);
    c.fillRect(cx, COURT.NET_Y + COURT.KITCHEN_DEPTH, 1, COURT.Y + COURT.HEIGHT - COURT.NET_Y - COURT.KITCHEN_DEPTH);

    // Corner markings
    [
      [COURT.X, COURT.Y, 4, 1], [COURT.X, COURT.Y, 1, 4],
      [COURT.X + COURT.WIDTH - 4, COURT.Y, 4, 1], [COURT.X + COURT.WIDTH - 1, COURT.Y, 1, 4],
      [COURT.X, COURT.Y + COURT.HEIGHT - 1, 4, 1], [COURT.X, COURT.Y + COURT.HEIGHT - 4, 1, 4],
      [COURT.X + COURT.WIDTH - 4, COURT.Y + COURT.HEIGHT - 1, 4, 1], [COURT.X + COURT.WIDTH - 1, COURT.Y + COURT.HEIGHT - 4, 1, 4],
    ].forEach(([x, y, w, h]) => c.fillRect(x, y, w, h));
  }

  // --- Net ---
  function drawNet(c) {
    const netY = COURT.NET_Y;
    const postW = 5, postH = 8;

    // Net shadow
    c.fillStyle = 'rgba(0,0,0,0.18)';
    c.fillRect(COURT.X, netY + 4, COURT.WIDTH, 2);

    // Net posts - left

    c.fillStyle = '#666';
    c.fillRect(COURT.X + COURT.WIDTH - 1, netY - 5, 3, 1);

    // Net mesh
    const meshColor = PALETTE.NET_GRAY || '#b0b0b0';
    for (let row = 0; row < 3; row++) {
      const my = netY - 2 + row;
      for (let x = COURT.X + 2; x < COURT.X + COURT.WIDTH - 2; x++) {
        if ((x + row) % 2 === 0) {
          c.fillStyle = meshColor;
          c.fillRect(x, my, 1, 1);
        }
      }
    }

    // Top cord
    c.fillStyle = '#e8e8e8';
    c.fillRect(COURT.X, netY - 3, COURT.WIDTH, 1);
  }

  // --- Kitchen labels ---
  function drawKitchenLabels(c) {
    drawTextCentered(c, 'KITCHEN', COURT.CENTER_X, COURT.NET_Y - COURT.KITCHEN_DEPTH + 14, 'rgba(255,255,255,0.4)', 1);
    drawTextCentered(c, 'KITCHEN', COURT.CENTER_X, COURT.NET_Y + 14, 'rgba(255,255,255,0.4)', 1);
  }

  // --- 10. Sideline Objects ---
  function drawSidelineObjects(c) {
    const leftX = COURT.X - 40;
    const rightX = COURT.X + COURT.WIDTH + 20;

    // LEFT SIDE: Park bench (12x6)

    c.fillRect(leftX, midY - 20, 12, 2); // top plank

    c.fillStyle = '#6b5210';
    c.fillRect(leftX, midY - 16, 12, 1); // front edge
    c.fillStyle = '#333333'; // metal legs
    c.fillRect(leftX + 1, midY - 16, 1, 4);
    c.fillRect(leftX + 10, midY - 16, 1, 4);

    // LEFT SIDE: Trash can (4x6)
    c.fillStyle = '#888888';
    c.fillRect(leftX + 2, midY + 5, 4, 6);
    c.fillStyle = '#999999'; // lid
    c.fillRect(leftX + 1, midY + 4, 6, 1);
    c.fillStyle = '#aaaaaa';
    c.fillRect(leftX + 2, midY + 4, 4, 1);
    c.fillStyle = '#777777'; // dark band
    c.fillRect(leftX + 2, midY + 8, 4, 1);

    // LEFT SIDE: Water fountain (5x7)
    c.fillStyle = '#999999'; // gray base
    c.fillRect(leftX + 14, midY + 20, 5, 3);
    c.fillStyle = '#aaaaaa';
    c.fillRect(leftX + 14, midY + 17, 5, 3);
    c.fillStyle = '#64b5f6'; // water basin
    c.fillRect(leftX + 15, midY + 15, 3, 2);
    c.fillStyle = '#90caf9'; // water highlight
    c.fillRect(leftX + 15, midY + 15, 3, 1);

    // RIGHT SIDE: Scoreboard stand (14x16)
    c.fillStyle = '#5c3a1a'; // wooden posts
    c.fillRect(rightX + 1, midY - 10, 2, 16);
    c.fillRect(rightX + 11, midY - 10, 2, 16);
    c.fillStyle = '#222222'; // dark board
    c.fillRect(rightX, midY - 16, 14, 10);
    c.fillStyle = '#333333'; // board border
    c.fillRect(rightX + 1, midY - 15, 12, 8);
    // Score area (white rectangles)
    c.fillStyle = '#e0e0e0';
    c.fillRect(rightX + 3, midY - 13, 3, 4);
    c.fillRect(rightX + 8, midY - 13, 3, 4);
    // Divider
    c.fillStyle = '#666666';
    c.fillRect(rightX + 7, midY - 13, 1, 4);

    // RIGHT SIDE: Ball hopper (6x6, wire frame)
    c.fillStyle = '#888888';
    c.fillRect(rightX + 2, midY + 10, 6, 1); // top rim
    c.fillRect(rightX + 2, midY + 15, 6, 1); // bottom
    c.fillRect(rightX + 2, midY + 10, 1, 6); // left wire
    c.fillRect(rightX + 7, midY + 10, 1, 6); // right wire
    // Cross wires
    c.fillRect(rightX + 2, midY + 12, 6, 1);
    // Balls inside (yellow dots)
    c.fillStyle = '#f4d35e';
    c.fillRect(rightX + 3, midY + 13, 2, 2);
    c.fillRect(rightX + 5, midY + 11, 2, 2);
  }

  // --- 11. Small rocks scattered ---
  function drawRocks(c) {
    const rockPositions = [
      [75, 65], [130, 45], [490, 30], [550, 55],
      [50, 180], [600, 170], [90, 310], [520, 330],
      [gateCenter - 15, INTERNAL_HEIGHT - 18],
      [gateCenter + 18, INTERNAL_HEIGHT - 22],
    ];
    c.fillStyle = '#8a8a8a';
    for (const [rx, ry] of rockPositions) {
      c.fillRect(rx, ry, 2, 2);
    }
    c.fillStyle = '#9a9a9a';
    for (const [rx, ry] of rockPositions) {
      c.fillRect(rx, ry, 1, 1);
    }
  }

  // === Render order (back to front) ===
  // 1. Grass base
  drawGrass(ctx);
  // 2. Stone path
  drawStonePath(ctx);
  // 3. Tree shadows (before trees)
  for (const [tx, ty, ts] of trees) {
    drawTreeShadow(ctx, tx, ty, ts);
  }
  // 4. Flower beds
  drawFlowerBeds(ctx);
  // 5. Bushes
  drawBushes(ctx);
  // 6. Bleachers
  drawBleachers(ctx);
  // 7. Banner
  drawBanner(ctx);
  // 8. Fence
  drawFence(ctx);
  // 9. Court surface + lines + net
  drawCourtSurface(ctx);
  drawCourtLines(ctx);
  drawNet(ctx);
  drawKitchenLabels(ctx);
  // 10. Sideline objects
  drawSidelineObjects(ctx);
  // 11. Small rocks
  drawRocks(ctx);
  // 12. Trees (last — canopy overlaps fence/court edges for depth)
  for (const [tx, ty, ts] of trees) {
    drawTree(ctx, tx, ty, ts);
  }

  courtBuffer = canvas;
}

function drawCourt(ctx) {
  if (!courtBuffer) buildCourtBuffer();
  ctx.drawImage(courtBuffer, 0, 0);
}

function drawPlayer(ctx, player) {
  const animState = player.animState || 'idle';
  const animFrame = player.animFrame || 0;
  drawPlayerSprite(ctx, player.x, player.y, player.avatar, player.facing, animState, animFrame, player.gender || 'male');
}

function drawBall(ctx, ball) {
  if (ball.active) {
    drawBallSprite(ctx, ball.x, ball.y, ball.z, ball.vx || 0, ball.vy || 0);
  }
}

function drawHUD(ctx, gameCtx) {
  const { player, opponent, score } = gameCtx;
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillRect(0, 0, INTERNAL_WIDTH, 14);
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.fillRect(0, 14, INTERNAL_WIDTH, 1);

  // Show serving indicator (*) next to whoever is serving
  const playerServing = score.serving === 'player';
  const playerLabel = `${playerServing ? '* ' : '  '}${player.name}: ${score.player}`;
  const oppLabel = `${!playerServing ? '* ' : '  '}AI: ${score.opponent}`;
  drawText(ctx, playerLabel, 4, 3, playerServing ? PALETTE.YELLOW : PALETTE.WHITE, 1);
  const { width } = measureText(oppLabel, 1);
  drawText(ctx, oppLabel, INTERNAL_WIDTH - width - 4, 3, !playerServing ? PALETTE.YELLOW : PALETTE.LIGHT_GRAY, 1);
  drawTextCentered(ctx, `G ${score.games[0]}-${score.games[1]}`, INTERNAL_WIDTH / 2, 3, PALETTE.YELLOW, 1);
}

function drawMenu(ctx, items, selectedIndex, x, y, color = PALETTE.WHITE, selectedColor = PALETTE.YELLOW, scale = 1) {
  for (let i = 0; i < items.length; i++) {
    const isSelected = i === selectedIndex;
    const label = isSelected ? `> ${items[i]}` : `  ${items[i]}`;
    drawText(ctx, label, x, y + i * (8 * scale + 3), isSelected ? selectedColor : color, scale);
  }
}

// ============================================================
// AI OPPONENT — Retro Tennis-style AI
// Moves to predicted landing spot. Can enter kitchen after bounce.
// ============================================================


function createAI(dupr) {
  const tier = DUPR_TIERS.find(t => dupr >= t.min && dupr <= t.max) || DUPR_TIERS[0];
  return {
    tier,
    reactionTimer: 0,
  };
}

function updateAI(ai, opponent, ball, rules, dt) {
  const tier = ai.tier;

  // Default ready position — behind kitchen line
  let targetX = COURT.CENTER_X;
  let targetY = COURT.NET_Y - COURT.KITCHEN_DEPTH - 20;

  if (ball.active && !ball.landed) {
    // Reset reaction timer when ball changes to player's hit
    if (ball.lastHitBy === 'player' && ai._lastSeenHitBy !== 'player') {
      ai.reactionTimer = 0;
    }
    ai._lastSeenHitBy = ball.lastHitBy;

    ai.reactionTimer += dt;
    const reacted = ai.reactionTimer >= tier.reactionDelay;

    // Always predict landing to start moving early
    const landing = predictLanding(ball);
    const ballComingToAI = ball.vy < 0 || landing.y < COURT.NET_Y;

    if (ballComingToAI && (reacted || ball.lastHitBy === 'opponent')) {
      // Ball heading toward AI side — move to intercept
      targetX = clamp(landing.x, COURT.X + 15, COURT.X + COURT.WIDTH - 15);

      // During two-bounce phase: stay BEHIND the landing spot to let ball bounce
      const mustWaitForBounce = (rules.rallyCount + 1) <= 2 &&
        !rules.doubleBounceCleared.opponent && rules.bounceCount.opponent === 0;

      if (mustWaitForBounce) {
        // Position behind the predicted landing spot (further from net)
        targetY = clamp(landing.y - 20, COURT.Y + 5, COURT.NET_Y - COURT.KITCHEN_DEPTH - 10);
      } else if (ball.bouncedInCourt) {
        // Ball already bounced — can approach freely
        targetY = clamp(landing.y, COURT.Y + 5, COURT.NET_Y - 10);
      } else {
        // Stay behind kitchen line
        targetY = clamp(landing.y, COURT.Y + 5, COURT.NET_Y - COURT.KITCHEN_DEPTH - 5);
      }
    } else if (!ballComingToAI) {
      // Ball going to player's side — return to ready position
      targetX = COURT.CENTER_X;
      targetY = COURT.NET_Y - COURT.KITCHEN_DEPTH - 15;
    }
  }

  // Move toward target
  const speed = PLAYER.SPEED * (0.8 + tier.min * 0.04);
  const dx = targetX - opponent.x - PLAYER.WIDTH / 2;
  const dy = targetY - opponent.y - PLAYER.HEIGHT / 2;
  const dist = Math.sqrt(dx * dx + dy * dy);

  if (dist > 3) {
    opponent.vx = (dx / dist) * speed;
    opponent.vy = (dy / dist) * speed;
  } else {
    opponent.vx = 0;
    opponent.vy = 0;
  }

  // Facing
  if (Math.abs(opponent.vx) > Math.abs(opponent.vy)) {
    opponent.facing = opponent.vx < 0 ? 'left' : 'right';
  } else {
    opponent.facing = opponent.vy > 0 ? 'down' : 'up';
  }

  // Animation
  if (Math.abs(opponent.vx) > 5 || Math.abs(opponent.vy) > 5) {
    opponent.animTime = (opponent.animTime || 0) + dt;
    opponent.animState = 'walk';
    opponent.animFrame = Math.floor(opponent.animTime / 0.15) % 4;
  } else {
    opponent.animState = 'idle';
    opponent.animFrame = 0;
    opponent.animTime = 0;
  }

  // Try to hit the ball — generous hit range
  if (ball.active && !ball.landed && ball.lastHitBy !== 'opponent') {
    const ballDist = distance(
      opponent.x + PLAYER.WIDTH / 2,
      opponent.y + PLAYER.HEIGHT / 2,
      ball.x, ball.y
    );

    if (ballDist < 35 && ball.z < 35) {
      return tryHitBall(ai, opponent, ball, tier, rules);
    }
  }

  return null;
}

function tryHitBall(ai, opponent, ball, tier, rules) {
  // TWO-BOUNCE RULE: AI must let ball bounce during the first two rally hits
  // rallyCount is incremented INSIDE onBallHit, so check current count
  // Rally hit 0→1 = receiver's first return (must bounce)
  // Rally hit 1→2 = server's first return (must bounce)
  const nextRallyCount = rules.rallyCount + 1;
  if (nextRallyCount <= 2 && !rules.doubleBounceCleared.opponent) {
    if (rules.bounceCount.opponent === 0) {
      return null; // Ball hasn't bounced on AI's side yet — WAIT
    }
  }

  // Very low whiff rate
  const whiffChance = tier.errorRate * 0.08;
  if (Math.random() < whiffChance) return null;

  // Kitchen volley check — can't volley while in kitchen
  const aiCenterY = opponent.y + PLAYER.HEIGHT / 2;
  const inKitchen = aiCenterY >= COURT.NET_Y - COURT.KITCHEN_DEPTH && aiCenterY <= COURT.NET_Y;
  if (inKitchen && rules.bounceCount.opponent === 0) {
    return null; // In kitchen + ball hasn't bounced = would be a volley fault, so wait
  }

  // Target: player's side, well within bounds
  const margin = 35;
  const targetX = clamp(
    COURT.CENTER_X + randRange(-70, 70),
    COURT.X + margin,
    COURT.X + COURT.WIDTH - margin
  );

  let targetY, flightTime, arcMult;
  const r = Math.random();

  if (tier.min >= 5.0) {
    // Pro: strategic variety
    if (r < 0.35) {
      targetY = COURT.NET_Y + COURT.KITCHEN_DEPTH + randRange(30, 80);
      flightTime = 0.8; arcMult = 1.0; // fast drive
    } else if (r < 0.65) {
      targetY = COURT.NET_Y + COURT.KITCHEN_DEPTH + randRange(10, 30);
      flightTime = 0.9; arcMult = 1.0; // dink
    } else {
      targetY = COURT.Y + COURT.HEIGHT - randRange(20, 50);
      flightTime = 1.6; arcMult = 2.0; // lob
    }
  } else if (tier.min >= 3.0) {
    targetY = COURT.NET_Y + COURT.KITCHEN_DEPTH + randRange(25, 65);
    flightTime = 0.9 + Math.random() * 0.3;
    arcMult = 1.0 + Math.random() * 0.3;
  } else {
    // Beginner: consistent, safe shots to mid-court
    targetY = COURT.NET_Y + COURT.KITCHEN_DEPTH + randRange(30, 60);
    flightTime = 1.0 + Math.random() * 0.2;
    arcMult = 1.0 + Math.random() * 0.2;
  }

  return { hit: true, targetX, targetY, flightTime, arcMult };
}

function aiServe(opponent, ball, serveSide) {
  opponent.y = COURT.Y + 2;
  const serveX = opponent.x + PLAYER.WIDTH / 2;
  const serveY = opponent.y + PLAYER.HEIGHT;

  // Cross-court serve: AI's right side targets player's right (screen right)
  // AI's right = screen left, so cross-court = screen right
  // serveSide is from AI's perspective based on AI's score
  const targetX = serveSide === 'right'
    ? COURT.X + COURT.WIDTH * 0.55 + Math.random() * (COURT.WIDTH * 0.2)   // cross to screen right
    : COURT.X + COURT.WIDTH * 0.25 + Math.random() * (COURT.WIDTH * 0.2);  // cross to screen left
  const targetY = COURT.NET_Y + COURT.KITCHEN_DEPTH + randRange(20, 50);

  return { serveX, serveY, targetX, targetY };
}

function resetAI(ai) {
  ai.reactionTimer = 0;
}

// ============================================================
// STATE MACHINE
// ============================================================

class StateMachine {
  constructor(gameCtx, states, initialState) {
    this.gameCtx = gameCtx;
    this.states = states;
    this.current = null;
    this.currentName = null;
    if (initialState) this.transition(initialState);
  }

  transition(stateName) {
    if (this.current && this.current.exit) {
      this.current.exit(this.gameCtx);
    }
    this.currentName = stateName;
    this.current = this.states[stateName];
    if (this.current && this.current.enter) {
      this.current.enter(this.gameCtx);
    }
  }

  update(dt) {
    if (this.current && this.current.update) {
      this.current.update(dt, this.gameCtx);
    }
  }

  render(ctx) {
    if (this.current && this.current.render) {
      this.current.render(ctx, this.gameCtx);
    }
  }
}

// ============================================================
// TITLE SCREEN STATE
// ============================================================


const TITLE_MENU = ['NEW GAME', 'HOW TO PLAY', 'SETTINGS'];
let titleSel = 0;
let animTimer = 0;
let ballX = 0;
let ballY = 0;
let ballVX = 0;
let ballVY = 0;
let firstInteraction = false;

const TitleScreen = {
  enter(gameCtx) {
    titleSel = 0;
    animTimer = 0;
    ballX = 80;
    ballY = 140;
    ballVX = 40;
    ballVY = -30;
    firstInteraction = false;
  },

  update(dt, gameCtx) {
    animTimer += dt;

    // Bouncing ball animation
    ballX += ballVX * dt;
    ballY += ballVY * dt;
    if (ballX < 60 || ballX > 250) ballVX *= -1;
    if (ballY < 100 || ballY > 165) ballVY *= -1;

    // Menu navigation
    if (isPressed('ArrowDown') || isPressed('s')) {
      titleSel = (titleSel + 1) % TITLE_MENU.length;
      handleFirstInteraction();
      playSFX('menuMove');
    }
    if (isPressed('ArrowUp') || isPressed('w')) {
      titleSel = (titleSel - 1 + TITLE_MENU.length) % TITLE_MENU.length;
      handleFirstInteraction();
      playSFX('menuMove');
    }
    if (isPressed('Enter') || isPressed(' ')) {
      handleFirstInteraction();
      playSFX('menuSelect');
      switch (titleSel) {
        case 0:
          gameCtx.stateMachine.transition(GameState.MODE_SELECT);
          break;
        case 1:
          gameCtx.stateMachine.transition(GameState.HOW_TO_PLAY);
          break;
        case 2:
          gameCtx.stateMachine.transition(GameState.SETTINGS);
          break;
      }
    }
  },

  render(ctx, gameCtx) {
    clearScreen(ctx, PALETTE.BLACK);

    // Scrolling court lines background
    ctx.fillStyle = PALETTE.DARK_GREEN;
    const offset = (animTimer * 10) % 20;
    for (let y = -20 + offset; y < INTERNAL_HEIGHT; y += 20) {
      ctx.fillRect(0, y, INTERNAL_WIDTH, 1);
    }
    for (let x = -20 + offset; x < INTERNAL_WIDTH; x += 20) {
      ctx.fillRect(x, 0, 1, INTERNAL_HEIGHT);
    }

    // Bouncing ball
    ctx.fillStyle = PALETTE.BALL_YELLOW;
    ctx.fillRect(Math.floor(ballX), Math.floor(ballY), 4, 4);

    // Title: "PICKLE SMASH"
    const titleY = 60;
    const bounce = Math.sin(animTimer * 3) * 2;

    // Shadow
    drawTextCentered(ctx, 'PICKLE', INTERNAL_WIDTH / 2 + 1, titleY + 1 + bounce, PALETTE.DARK_GREEN, 3);
    drawTextCentered(ctx, 'SMASH', INTERNAL_WIDTH / 2 + 1, titleY + 29 + bounce, PALETTE.DARK_GREEN, 3);

    // Main text
    drawTextCentered(ctx, 'PICKLE', INTERNAL_WIDTH / 2, titleY + bounce, PALETTE.YELLOW, 3);
    drawTextCentered(ctx, 'SMASH', INTERNAL_WIDTH / 2, titleY + 28 + bounce, PALETTE.ORANGE, 3);

    // Subtitle
    drawTextCentered(ctx, 'RETRO PICKLEBALL', INTERNAL_WIDTH / 2, titleY + 56, PALETTE.LIGHT_GRAY, 1);

    // Menu
    const menuX = INTERNAL_WIDTH / 2 - 50;
    const menuY = 210;
    drawMenu(ctx, TITLE_MENU, titleSel, menuX, menuY, PALETTE.WHITE, PALETTE.YELLOW, 1);

    // Footer
    drawTextCentered(ctx, 'PRESS ENTER TO SELECT', INTERNAL_WIDTH / 2, INTERNAL_HEIGHT - 10, PALETTE.GRAY, 1);
  },
};

function handleFirstInteraction() {
  if (!firstInteraction) {
    firstInteraction = true;
    initAudio();
    playBGM('title');
  }
}

const MODES = [
  { mode: GameMode.MENS_SINGLES,   label: "MEN'S SINGLES",   type: '1V1', available: true },
  { mode: GameMode.WOMENS_SINGLES, label: "WOMEN'S SINGLES", type: '1V1', available: true },
  { mode: GameMode.MENS_DOUBLES,   label: "MEN'S DOUBLES",   type: '2V2', available: false },
  { mode: GameMode.WOMENS_DOUBLES, label: "WOMEN'S DOUBLES", type: '2V2', available: false },
  { mode: GameMode.MIXED_DOUBLES,  label: "MIXED DOUBLES",   type: '2V2', available: false },
];

let modeSel = 0;

const ModeSelect = {
  enter(gameCtx) {
    modeSel = 0;
  },

  update(dt, gameCtx) {
    if (isPressed('ArrowDown') || isPressed('s')) {
      modeSel = (modeSel + 1) % MODES.length;
      playSFX('menuMove');
    }
    if (isPressed('ArrowUp') || isPressed('w')) {
      modeSel = (modeSel - 1 + MODES.length) % MODES.length;
      playSFX('menuMove');
    }
    if (isPressed('Enter') || isPressed(' ')) {
      const selected = MODES[modeSel];
      if (selected.available) {
        playSFX('menuSelect');
        gameCtx.gameMode = selected.mode;
        gameCtx.stateMachine.transition(GameState.PLAYER_SETUP);
      } else {
        playSFX('fault');
      }
    }
    if (isPressed('Escape')) {
      playSFX('menuSelect');
      gameCtx.stateMachine.transition(GameState.TITLE_SCREEN);
    }
  },

  render(ctx, gameCtx) {
    clearScreen(ctx, PALETTE.DARK_BLUE);
    drawTextCentered(ctx, 'SELECT MODE', INTERNAL_WIDTH / 2, 12, PALETTE.YELLOW, 2);

    const startY = 80;
    const lineH = 35;

    for (let i = 0; i < MODES.length; i++) {
      const m = MODES[i];
      const isSelected = i === modeSel;
      const y = startY + i * lineH;

      if (isSelected) {
        ctx.fillStyle = 'rgba(255,255,255,0.08)';
        ctx.fillRect(30, y - 2, INTERNAL_WIDTH - 60, lineH - 2);
      }

      const badgeColor = m.type === '1V1' ? PALETTE.LIGHT_BLUE : PALETTE.ORANGE;
      ctx.fillStyle = isSelected ? badgeColor : PALETTE.GRAY;
      ctx.fillRect(40, y, 20, 8);
      drawText(ctx, m.type, 41, y + 1, PALETTE.BLACK, 1);

      const labelColor = !m.available ? PALETTE.GRAY : isSelected ? PALETTE.WHITE : PALETTE.LIGHT_GRAY;
      drawText(ctx, m.label, 66, y + 1, labelColor, 1);

      if (!m.available) {
        drawText(ctx, '(SOON)', 200, y + 1, PALETTE.GRAY, 1);
      }
    }

    drawTextCentered(ctx, 'ENTER: SELECT   ESC: BACK', INTERNAL_WIDTH / 2, INTERNAL_HEIGHT - 10, PALETTE.GRAY, 1);
  },
};
